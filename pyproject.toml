[project]
name = "crm-prospect-qualifier"
version = "0.1.0"
description = "Prototype CRM prospect qualification module for a fictional chemical distributor."
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.isort]
profile = "black"
